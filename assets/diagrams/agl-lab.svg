<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agl-lab-t agl-lab-d" width="640" height="640" preserveAspectRatio="xMidYMin meet"><title id="agl-lab-t">The lab as a whole</title><desc id="agl-lab-d">Four tracks of cases, run in rounds on three filters, then tested on unseen items, then on a real assistant. Results go into what held and what broke.</desc><style>
.dg{background:var(--d-bg,#ffffff);--d-ink:#0f172a;--d-mut:#52617a;--d-line:#b7c3d4;--d-panel:#f1f5fa;--d-acc:#0a7285;--d-accs:rgba(10,114,133,.12);--d-ok:#0b7a5b;--d-oks:rgba(11,122,91,.12);--d-bad:#c0264a;--d-bads:rgba(192,38,74,.12);--d-warn:#8a5208;--d-warns:rgba(138,82,8,.14);font-family:var(--a-fb,system-ui,-apple-system,"Segoe UI",sans-serif)}
@media (prefers-color-scheme:dark){.dg{background:var(--d-bg,#0b1220);--d-ink:#f1f5f9;--d-mut:#93a1bd;--d-line:#2c3a55;--d-panel:#101a2c;--d-acc:#4de2ff;--d-accs:rgba(77,226,255,.12);--d-ok:#7df2d0;--d-oks:rgba(125,242,208,.12);--d-bad:#ff7a93;--d-bads:rgba(255,122,147,.14);--d-warn:#f7c873;--d-warns:rgba(247,200,115,.14)}}
.dg text{fill:var(--d-ink)}
.dg .dg-t{font-weight:700;font-size:14px}
.dg .dg-s{font-size:12px;fill:var(--d-mut)}
.dg .dg-n{font:600 11px/1 var(--a-fm,ui-monospace,Menlo,monospace);fill:var(--d-mut)}
.dg .dg-h{font-weight:700;font-size:15px}
.dg .dg-node{fill:var(--d-panel);stroke:var(--d-line);stroke-width:1.5}
.dg .dg-acc{stroke:var(--d-acc);fill:var(--d-accs)}
.dg .dg-okb{stroke:var(--d-ok);fill:var(--d-oks)}
.dg .dg-badb{stroke:var(--d-bad);fill:var(--d-bads)}
.dg .dg-warnb{stroke:var(--d-warn);fill:var(--d-warns)}
.dg .dg-ln{stroke:var(--d-line);stroke-width:2;fill:none}
.dg .dg-dash{stroke-dasharray:5 5}
.dg .dg-ar{fill:var(--d-line)}
.dg .dg-lbl{font-size:12px;font-weight:600}
.dg .dg-good{fill:var(--d-ok)}.dg .dg-bd{fill:var(--d-bad)}.dg .dg-wn{fill:var(--d-warn)}
.dg text.dg-good,.dg text.dg-bd,.dg text.dg-wn{font-size:12px;font-weight:700}
.dg text.dg-good{fill:var(--d-ok)}.dg text.dg-bd{fill:var(--d-bad)}.dg text.dg-wn{fill:var(--d-warn)}
.dg .dg-pkt{offset-rotate:0deg;opacity:0}
@media (prefers-reduced-motion:reduce){.dg *{animation:none!important}.dg .dg-pkt{opacity:0}.dg .dg-badge{opacity:1!important}}
@keyframes agl-lab-d{0%{offset-distance:0%;opacity:0}5%{opacity:1}90%{offset-distance:100%;opacity:1}96%{opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-lab-d{offset-path:path('M 60 190 L 580 190');animation:agl-lab-d 10s linear infinite}</style>
<text class="dg-h" x="20" y="16" text-anchor="start" >Four tracks, 59 cases, all made-up data</text>
<rect class="dg-node " x="20" y="30" width="140" height="66" rx="10"/>
<text class="dg-t" x="34" y="52">A  Gateway</text>
<text class="dg-s" x="34" y="71">16 cases</text>
<rect class="dg-node " x="170" y="30" width="140" height="66" rx="10"/>
<text class="dg-t" x="184" y="52">G  Guardrail</text>
<text class="dg-s" x="184" y="71">17 cases</text>
<rect class="dg-node " x="320" y="30" width="140" height="66" rx="10"/>
<text class="dg-t" x="334" y="52">I  Agent identity</text>
<text class="dg-s" x="334" y="71">12 cases</text>
<rect class="dg-node " x="470" y="30" width="140" height="66" rx="10"/>
<text class="dg-t" x="484" y="52">E  Audit</text>
<text class="dg-s" x="484" y="71">14 cases</text>
<path class="dg-ln" d="M 320 96 L 320 128"/>
<polygon class="dg-ar" points="315,119 325,119 320,127"/>
<text class="dg-h" x="20" y="150" text-anchor="start" >Run in rounds. Guesses written first and committed to git.</text>
<path class="dg-ln" d="M 60 190 L 580 190"/>
<circle cx="60" cy="190" r="16" class="dg-node dg-acc"/>
<text class="dg-t" x="60" y="195" text-anchor="middle" >1</text>
<text class="dg-s" x="60" y="226" text-anchor="middle" >v1</text>
<circle cx="190" cy="190" r="16" class="dg-node dg-acc"/>
<text class="dg-t" x="190" y="195" text-anchor="middle" >2</text>
<text class="dg-s" x="190" y="226" text-anchor="middle" >v2</text>
<circle cx="320" cy="190" r="16" class="dg-node dg-acc"/>
<text class="dg-t" x="320" y="195" text-anchor="middle" >3</text>
<text class="dg-s" x="320" y="226" text-anchor="middle" >v2</text>
<circle cx="450" cy="190" r="16" class="dg-node dg-acc"/>
<text class="dg-t" x="450" y="195" text-anchor="middle" >4</text>
<text class="dg-s" x="450" y="226" text-anchor="middle" >v3</text>
<circle cx="580" cy="190" r="16" class="dg-node dg-acc"/>
<text class="dg-t" x="580" y="195" text-anchor="middle" >5</text>
<text class="dg-s" x="580" y="226" text-anchor="middle" >unseen</text>
<circle id="agl-lab-d" class="dg-pkt dg-good" r="7" cx="0" cy="0"/>
<path class="dg-ln" d="M 320 240 L 320 268"/>
<polygon class="dg-ar" points="315,259 325,259 320,267"/>
<rect class="dg-node " x="20" y="268" width="290" height="76" rx="10"/>
<text class="dg-t" x="34" y="290">Then a real assistant</text>
<text class="dg-s" x="34" y="309">Nine requests under one made-up policy.</text>
<rect class="dg-node " x="330" y="268" width="290" height="76" rx="10"/>
<text class="dg-t" x="344" y="290">And a held-out test</text>
<text class="dg-s" x="344" y="309">Items the filters had never seen.</text>
<path class="dg-ln" d="M 165 344 L 165 384 L 320 384 L 320 396"/>
<polygon class="dg-ar" points="315,387 325,387 320,395"/>
<path class="dg-ln" d="M 475 344 L 475 384 L 320 384"/>
<rect class="dg-node dg-okb" x="20" y="396" width="290" height="120" rx="10"/>
<text class="dg-t" x="34" y="418">What held</text>
<text class="dg-s" x="34" y="440" text-anchor="start" >• The register and approvals</text>
<text class="dg-s" x="34" y="460" text-anchor="start" >• The audit trail</text>
<text class="dg-s" x="34" y="480" text-anchor="start" >• Kill switches and tokens</text>
<text class="dg-s" x="34" y="500" text-anchor="start" >• Checksums with fixed shapes</text>
<rect class="dg-node dg-badb" x="330" y="396" width="290" height="120" rx="10"/>
<text class="dg-t" x="344" y="418">What broke</text>
<text class="dg-s" x="344" y="440" text-anchor="start" >• Anything that depends on meaning</text>
<text class="dg-s" x="344" y="460" text-anchor="start" >• Hinglish and new wordings</text>
<text class="dg-s" x="344" y="480" text-anchor="start" >• Data split across messages</text>
<text class="dg-s" x="344" y="500" text-anchor="start" >• A score on a set I tuned to</text>
<text class="dg-s" x="320" y="560" text-anchor="middle" >One laptop, made-up data, my own cases. A data point, not a guarantee.</text>
</svg>
