<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" viewBox="0 0 640 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agl-gate-t agl-gate-d" width="640" height="590" preserveAspectRatio="xMidYMin meet"><title id="agl-gate-t">The agent proposes; a gateway decides; an executor acts</title><desc id="agl-gate-d">An agent sends a fixed-shape request to a gateway. A person approves risky actions. The gateway signs a decision. A separate executor borrows a five-minute credential from a vault and calls the identity API. A leaked token used directly is refused because the API accepts it only from the executor.</desc><style>
.dg{background:var(--d-bg,#ffffff);--d-ink:#0f172a;--d-mut:#52617a;--d-line:#b7c3d4;--d-panel:#f1f5fa;--d-acc:#0a7285;--d-accs:rgba(10,114,133,.12);--d-ok:#0b7a5b;--d-oks:rgba(11,122,91,.12);--d-bad:#c0264a;--d-bads:rgba(192,38,74,.12);--d-warn:#8a5208;--d-warns:rgba(138,82,8,.14);font-family:var(--a-fb,system-ui,-apple-system,"Segoe UI",sans-serif)}
@media (prefers-color-scheme:dark){.dg{background:var(--d-bg,#0b1220);--d-ink:#f1f5f9;--d-mut:#93a1bd;--d-line:#2c3a55;--d-panel:#101a2c;--d-acc:#4de2ff;--d-accs:rgba(77,226,255,.12);--d-ok:#7df2d0;--d-oks:rgba(125,242,208,.12);--d-bad:#ff7a93;--d-bads:rgba(255,122,147,.14);--d-warn:#f7c873;--d-warns:rgba(247,200,115,.14)}}
.dg text{fill:var(--d-ink)}
.dg .dg-t{font-weight:700;font-size:14px}
.dg .dg-s{font-size:12px;fill:var(--d-mut)}
.dg .dg-n{font:600 11px/1 var(--a-fm,ui-monospace,Menlo,monospace);fill:var(--d-mut)}
.dg .dg-h{font-weight:700;font-size:15px}
.dg .dg-node{fill:var(--d-panel);stroke:var(--d-line);stroke-width:1.5}
.dg .dg-acc{stroke:var(--d-acc);fill:var(--d-accs)}
.dg .dg-okb{stroke:var(--d-ok);fill:var(--d-oks)}
.dg .dg-badb{stroke:var(--d-bad);fill:var(--d-bads)}
.dg .dg-warnb{stroke:var(--d-warn);fill:var(--d-warns)}
.dg .dg-ln{stroke:var(--d-line);stroke-width:2;fill:none}
.dg .dg-dash{stroke-dasharray:5 5}
.dg .dg-ar{fill:var(--d-line)}
.dg .dg-lbl{font-size:12px;font-weight:600}
.dg .dg-good{fill:var(--d-ok)}.dg .dg-bd{fill:var(--d-bad)}.dg .dg-wn{fill:var(--d-warn)}
.dg text.dg-good,.dg text.dg-bd,.dg text.dg-wn{font-size:12px;font-weight:700}
.dg text.dg-good{fill:var(--d-ok)}.dg text.dg-bd{fill:var(--d-bad)}.dg text.dg-wn{fill:var(--d-warn)}
.dg .dg-pkt{offset-rotate:0deg;opacity:0}
@media (prefers-reduced-motion:reduce){.dg *{animation:none!important}.dg .dg-pkt{opacity:0}.dg .dg-badge{opacity:1!important}}
@keyframes agl-gate-a{0%{offset-distance:0%;opacity:0}4%{offset-distance:0%;opacity:1}40%{offset-distance:100%;opacity:1}46%{offset-distance:100%;opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-gate-a{offset-path:path('M 135 82 L 135 130 L 135 204 L 135 252 L 135 326 L 135 380');animation:agl-gate-a 10s linear infinite}
@keyframes agl-gate-b{0%{offset-distance:0%;opacity:0}50%{offset-distance:0%;opacity:0}52%{offset-distance:0%;opacity:1}88%{offset-distance:100%;opacity:1}93%{offset-distance:100%;opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-gate-b{offset-path:path('M 475 82 L 475 100 L 632 100 L 632 417 L 330 417');animation:agl-gate-b 10s linear infinite}
@keyframes agl-gate-bg{0%,80%{opacity:0}82%,96%{opacity:1}99%,100%{opacity:0}}
.dg #agl-gate-bg{animation:agl-gate-bg 10s linear infinite}</style>
<rect class="dg-node " x="20" y="20" width="230" height="62" rx="10"/>
<text class="dg-t" x="34" y="42">The agent</text>
<text class="dg-s" x="34" y="61">Proposes. Holds no credential.</text>
<rect class="dg-node dg-badb" x="330" y="20" width="290" height="62" rx="10"/>
<text class="dg-t" x="344" y="42">A leaked token</text>
<text class="dg-s" x="344" y="61">Found in a config file.</text>
<rect class="dg-node dg-acc" x="20" y="130" width="230" height="74" rx="10"/>
<text class="dg-t" x="34" y="152">Gateway</text>
<text class="dg-s" x="34" y="171">Identity, shape, policy, rate.</text>
<text class="dg-s" x="34" y="188" text-anchor="start" >Signs the decision.</text>
<rect class="dg-node dg-warnb" x="330" y="130" width="290" height="74" rx="10"/>
<text class="dg-t" x="344" y="152">A named person</text>
<text class="dg-s" x="344" y="171">Approves risky actions, such as a</text>
<text class="dg-s" x="344" y="188" text-anchor="start" >disable. Sees the person and the request.</text>
<rect class="dg-node " x="20" y="252" width="230" height="74" rx="10"/>
<text class="dg-t" x="34" y="274">Executor</text>
<text class="dg-s" x="34" y="293">Ordinary code, its own identity.</text>
<text class="dg-s" x="34" y="310" text-anchor="start" >Checks the signature.</text>
<rect class="dg-node dg-okb" x="330" y="252" width="290" height="74" rx="10"/>
<text class="dg-t" x="344" y="274">Vault</text>
<text class="dg-s" x="344" y="293">Lends a five-minute credential</text>
<text class="dg-s" x="344" y="310" text-anchor="start" >to the executor only.</text>
<rect class="dg-node " x="20" y="380" width="230" height="74" rx="10"/>
<text class="dg-t" x="34" y="402">Identity API</text>
<text class="dg-s" x="34" y="421">Create, disable, read.</text>
<text class="dg-s" x="34" y="438" text-anchor="start" >Accepts it only from the executor.</text>
<rect class="dg-node " x="20" y="490" width="600" height="56" rx="10"/>
<text class="dg-t" x="34" y="512">Audit log</text>
<text class="dg-s" x="34" y="531">Who asked, what was decided, who approved, what the directory recorded. No secrets.</text>
<path class="dg-ln" d="M 135 82 L 135 130"/>
<polygon class="dg-ar" points="130,121 140,121 135,129"/>
<text class="dg-s" x="145" y="110" text-anchor="start" >request, fixed shape</text>
<path class="dg-ln" d="M 250 167 L 328 167"/>
<polygon class="dg-ar" points="320,162 320,172 328,167"/>
<text class="dg-s" x="289" y="158" text-anchor="middle" >risky only</text>
<path class="dg-ln" d="M 135 204 L 135 252"/>
<polygon class="dg-ar" points="130,243 140,243 135,251"/>
<text class="dg-s" x="145" y="232" text-anchor="start" >signed decision</text>
<path class="dg-ln" d="M 250 289 L 328 289"/>
<polygon class="dg-ar" points="320,284 320,294 328,289"/>
<text class="dg-s" x="289" y="280" text-anchor="middle" >asks</text>
<path class="dg-ln" d="M 135 326 L 135 380"/>
<polygon class="dg-ar" points="130,371 140,371 135,379"/>
<text class="dg-s" x="145" y="358" text-anchor="start" >call with the lease</text>
<path class="dg-ln dg-dash" d="M 475 82 L 475 100 L 632 100 L 632 417 L 252 417"/>
<polygon class="dg-ar" points="260,412 260,422 252,417"/>
<text class="dg-s" x="440" y="412" text-anchor="middle" >direct call</text>
<circle id="agl-gate-a" class="dg-pkt dg-good" r="7" cx="0" cy="0"/>
<circle id="agl-gate-b" class="dg-pkt dg-bd" r="7" cx="0" cy="0"/>
<text id="agl-gate-bg" class="dg-badge dg-bd" x="330" y="442" opacity="0">Refused: wrong caller. Nothing changes.</text>
</svg>
