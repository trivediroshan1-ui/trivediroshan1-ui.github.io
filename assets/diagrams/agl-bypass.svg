<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agl-bypass-t agl-bypass-d" width="640" height="600" preserveAspectRatio="xMidYMin meet"><title id="agl-bypass-t">How a bypass is noticed and answered</title><desc id="agl-bypass-d">The identity API&#x27;s own change log is compared with the gateway&#x27;s signed decisions. A matched change is fine. A change with no decision is a bypass alert. The policy switches off the agent it can trace and revokes its credentials, evidence is copied first, and a person decides what to undo.</desc><style>
.dg{background:var(--d-bg,#ffffff);--d-ink:#0f172a;--d-mut:#52617a;--d-line:#b7c3d4;--d-panel:#f1f5fa;--d-acc:#0a7285;--d-accs:rgba(10,114,133,.12);--d-ok:#0b7a5b;--d-oks:rgba(11,122,91,.12);--d-bad:#c0264a;--d-bads:rgba(192,38,74,.12);--d-warn:#8a5208;--d-warns:rgba(138,82,8,.14);font-family:var(--a-fb,system-ui,-apple-system,"Segoe UI",sans-serif)}
@media (prefers-color-scheme:dark){.dg{background:var(--d-bg,#0b1220);--d-ink:#f1f5f9;--d-mut:#93a1bd;--d-line:#2c3a55;--d-panel:#101a2c;--d-acc:#4de2ff;--d-accs:rgba(77,226,255,.12);--d-ok:#7df2d0;--d-oks:rgba(125,242,208,.12);--d-bad:#ff7a93;--d-bads:rgba(255,122,147,.14);--d-warn:#f7c873;--d-warns:rgba(247,200,115,.14)}}
.dg text{fill:var(--d-ink)}
.dg .dg-t{font-weight:700;font-size:14px}
.dg .dg-s{font-size:12px;fill:var(--d-mut)}
.dg .dg-n{font:600 11px/1 var(--a-fm,ui-monospace,Menlo,monospace);fill:var(--d-mut)}
.dg .dg-h{font-weight:700;font-size:15px}
.dg .dg-node{fill:var(--d-panel);stroke:var(--d-line);stroke-width:1.5}
.dg .dg-acc{stroke:var(--d-acc);fill:var(--d-accs)}
.dg .dg-okb{stroke:var(--d-ok);fill:var(--d-oks)}
.dg .dg-badb{stroke:var(--d-bad);fill:var(--d-bads)}
.dg .dg-warnb{stroke:var(--d-warn);fill:var(--d-warns)}
.dg .dg-ln{stroke:var(--d-line);stroke-width:2;fill:none}
.dg .dg-dash{stroke-dasharray:5 5}
.dg .dg-ar{fill:var(--d-line)}
.dg .dg-lbl{font-size:12px;font-weight:600}
.dg .dg-good{fill:var(--d-ok)}.dg .dg-bd{fill:var(--d-bad)}.dg .dg-wn{fill:var(--d-warn)}
.dg text.dg-good,.dg text.dg-bd,.dg text.dg-wn{font-size:12px;font-weight:700}
.dg text.dg-good{fill:var(--d-ok)}.dg text.dg-bd{fill:var(--d-bad)}.dg text.dg-wn{fill:var(--d-warn)}
.dg .dg-pkt{offset-rotate:0deg;opacity:0}
@media (prefers-reduced-motion:reduce){.dg *{animation:none!important}.dg .dg-pkt{opacity:0}.dg .dg-badge{opacity:1!important}}
@keyframes agl-bypass-a{0%{offset-distance:0%;opacity:0}4%{offset-distance:0%;opacity:1}36%{offset-distance:100%;opacity:1}41%{offset-distance:100%;opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-bypass-a{offset-path:path('M 190 82 L 190 250');animation:agl-bypass-a 10s linear infinite}
@keyframes agl-bypass-b{0%{offset-distance:0%;opacity:0}46%{offset-distance:0%;opacity:0}48%{offset-distance:0%;opacity:1}90%{offset-distance:100%;opacity:1}95%{offset-distance:100%;opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-bypass-b{offset-path:path('M 190 82 L 190 160 L 450 160 L 450 250 L 450 312 L 485 312 L 485 350 L 485 458');animation:agl-bypass-b 10s linear infinite}</style>
<rect class="dg-node " x="20" y="20" width="270" height="62" rx="10"/>
<text class="dg-t" x="34" y="42">Identity API change log</text>
<text class="dg-s" x="34" y="61">Every change, and who called.</text>
<rect class="dg-node " x="350" y="20" width="270" height="62" rx="10"/>
<text class="dg-t" x="364" y="42">Gateway decisions</text>
<text class="dg-s" x="364" y="61">Every change it signed.</text>
<path class="dg-ln" d="M 190 82 L 190 130"/>
<polygon class="dg-ar" points="185,121 195,121 190,129"/>
<path class="dg-ln" d="M 450 82 L 450 130"/>
<polygon class="dg-ar" points="445,121 455,121 450,129"/>
<rect class="dg-node dg-acc" x="120" y="130" width="400" height="62" rx="10"/>
<text class="dg-t" x="134" y="152">Compare, every night or hour</text>
<text class="dg-s" x="134" y="171">Every change should match a decision.</text>
<path class="dg-ln" d="M 190 192 L 190 250"/>
<polygon class="dg-ar" points="185,241 195,241 190,249"/>
<text class="dg-lbl dg-good" x="200" y="226" text-anchor="start" >has a decision</text>
<path class="dg-ln" d="M 450 192 L 450 250"/>
<polygon class="dg-ar" points="445,241 455,241 450,249"/>
<text class="dg-lbl dg-bd" x="460" y="226" text-anchor="start" >has none</text>
<rect class="dg-node dg-okb" x="20" y="250" width="270" height="62" rx="10"/>
<text class="dg-t" x="34" y="272">Matched</text>
<text class="dg-s" x="34" y="291">Nothing to do. Not flagged.</text>
<rect class="dg-node dg-badb" x="350" y="250" width="270" height="62" rx="10"/>
<text class="dg-t" x="364" y="272">A bypass alert</text>
<text class="dg-s" x="364" y="291">Someone changed it another way.</text>
<path class="dg-ln" d="M 485 312 L 485 350"/>
<polygon class="dg-ar" points="480,341 490,341 485,349"/>
<rect class="dg-node dg-warnb" x="350" y="350" width="270" height="108" rx="10"/>
<text class="dg-t" x="364" y="372">The policy acts at once</text>
<text class="dg-s" x="364" y="396" text-anchor="start" >Switches off the agent it can trace</text>
<text class="dg-s" x="364" y="414" text-anchor="start" >Cancels its waiting approvals</text>
<text class="dg-s" x="364" y="432" text-anchor="start" >Revokes its leases and the leaked token</text>
<rect class="dg-node " x="20" y="350" width="310" height="108" rx="10"/>
<text class="dg-t" x="34" y="372">What it does not catch</text>
<text class="dg-s" x="34" y="396" text-anchor="start" >A bypass that makes the same change as a real</text>
<text class="dg-s" x="34" y="414" text-anchor="start" >request at the same moment: only the extra</text>
<text class="dg-s" x="34" y="432" text-anchor="start" >one is flagged. The change itself stays.</text>
<path class="dg-ln" d="M 485 458 L 485 480 L 165 480 L 165 500"/>
<polygon class="dg-ar" points="160,491 170,491 165,499"/>
<path class="dg-ln" d="M 485 480 L 485 500"/>
<polygon class="dg-ar" points="480,491 490,491 485,499"/>
<rect class="dg-node " x="20" y="500" width="290" height="80" rx="10"/>
<text class="dg-t" x="34" y="522">Evidence first</text>
<text class="dg-s" x="34" y="546" text-anchor="start" >Copy the logs, hash the copy, record who</text>
<text class="dg-s" x="34" y="564" text-anchor="start" >copied it and when.</text>
<rect class="dg-node " x="330" y="500" width="290" height="80" rx="10"/>
<text class="dg-t" x="344" y="522">A person decides</text>
<text class="dg-s" x="344" y="546" text-anchor="start" >The sponsor and the head of IAM decide</text>
<text class="dg-s" x="344" y="564" text-anchor="start" >what to roll back, by a named approver.</text>
<circle id="agl-bypass-a" class="dg-pkt dg-good" r="7" cx="0" cy="0"/>
<circle id="agl-bypass-b" class="dg-pkt dg-bd" r="7" cx="0" cy="0"/>
</svg>
