<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" viewBox="0 0 640 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agl-audit-t agl-audit-d" width="640" height="620" preserveAspectRatio="xMidYMin meet"><title id="agl-audit-t">The tamper-evident log</title><desc id="agl-audit-d">Each log line includes a fingerprint of the line before it. Editing or deleting a line breaks the chain from that point. Cutting lines off the end is only visible against an anchor kept somewhere else.</desc><style>
.dg{background:var(--d-bg,#ffffff);--d-ink:#0f172a;--d-mut:#52617a;--d-line:#b7c3d4;--d-panel:#f1f5fa;--d-acc:#0a7285;--d-accs:rgba(10,114,133,.12);--d-ok:#0b7a5b;--d-oks:rgba(11,122,91,.12);--d-bad:#c0264a;--d-bads:rgba(192,38,74,.12);--d-warn:#8a5208;--d-warns:rgba(138,82,8,.14);font-family:var(--a-fb,system-ui,-apple-system,"Segoe UI",sans-serif)}
@media (prefers-color-scheme:dark){.dg{background:var(--d-bg,#0b1220);--d-ink:#f1f5f9;--d-mut:#93a1bd;--d-line:#2c3a55;--d-panel:#101a2c;--d-acc:#4de2ff;--d-accs:rgba(77,226,255,.12);--d-ok:#7df2d0;--d-oks:rgba(125,242,208,.12);--d-bad:#ff7a93;--d-bads:rgba(255,122,147,.14);--d-warn:#f7c873;--d-warns:rgba(247,200,115,.14)}}
.dg text{fill:var(--d-ink)}
.dg .dg-t{font-weight:700;font-size:14px}
.dg .dg-s{font-size:12px;fill:var(--d-mut)}
.dg .dg-n{font:600 11px/1 var(--a-fm,ui-monospace,Menlo,monospace);fill:var(--d-mut)}
.dg .dg-h{font-weight:700;font-size:15px}
.dg .dg-node{fill:var(--d-panel);stroke:var(--d-line);stroke-width:1.5}
.dg .dg-acc{stroke:var(--d-acc);fill:var(--d-accs)}
.dg .dg-okb{stroke:var(--d-ok);fill:var(--d-oks)}
.dg .dg-badb{stroke:var(--d-bad);fill:var(--d-bads)}
.dg .dg-warnb{stroke:var(--d-warn);fill:var(--d-warns)}
.dg .dg-ln{stroke:var(--d-line);stroke-width:2;fill:none}
.dg .dg-dash{stroke-dasharray:5 5}
.dg .dg-ar{fill:var(--d-line)}
.dg .dg-lbl{font-size:12px;font-weight:600}
.dg .dg-good{fill:var(--d-ok)}.dg .dg-bd{fill:var(--d-bad)}.dg .dg-wn{fill:var(--d-warn)}
.dg text.dg-good,.dg text.dg-bd,.dg text.dg-wn{font-size:12px;font-weight:700}
.dg text.dg-good{fill:var(--d-ok)}.dg text.dg-bd{fill:var(--d-bad)}.dg text.dg-wn{fill:var(--d-warn)}
.dg .dg-pkt{offset-rotate:0deg;opacity:0}
@media (prefers-reduced-motion:reduce){.dg *{animation:none!important}.dg .dg-pkt{opacity:0}.dg .dg-badge{opacity:1!important}}
@keyframes agl-audit-t{0%,30%{opacity:0}34%,70%{opacity:1}74%,100%{opacity:0}}
.dg #agl-audit-t{animation:agl-audit-t 10s linear infinite}
@keyframes agl-audit-p{0%{offset-distance:0%;opacity:0}4%{offset-distance:0%;opacity:1}28%{offset-distance:100%;opacity:1}30%{offset-distance:100%;opacity:0}100%{offset-distance:100%;opacity:0}}
.dg #agl-audit-p{offset-path:path('M 200 20 L 200 380');animation:agl-audit-p 10s linear infinite}</style>
<rect class="dg-node " x="20" y="20" width="360" height="56" rx="10"/>
<text class="dg-t" x="34" y="42">Line 1</text>
<text class="dg-s" x="34" y="61">A call allowed for use U1</text>
<text class="dg-n" x="366" y="42" text-anchor="end" >start</text>
<path class="dg-ln" d="M 200 76 L 200 100"/>
<polygon class="dg-ar" points="195,91 205,91 200,99"/>
<rect class="dg-node " x="20" y="100" width="360" height="56" rx="10"/>
<text class="dg-t" x="34" y="122">Line 2</text>
<text class="dg-s" x="34" y="141">A call blocked: personal data</text>
<text class="dg-n" x="366" y="122" text-anchor="end" >fingerprint of line 1</text>
<path class="dg-ln" d="M 200 156 L 200 180"/>
<polygon class="dg-ar" points="195,171 205,171 200,179"/>
<rect class="dg-node " x="20" y="180" width="360" height="56" rx="10"/>
<text class="dg-t" x="34" y="202">Line 3</text>
<text class="dg-s" x="34" y="221">Approval recorded</text>
<text class="dg-n" x="366" y="202" text-anchor="end" >fingerprint of line 2</text>
<path class="dg-ln" d="M 200 236 L 200 260"/>
<polygon class="dg-ar" points="195,251 205,251 200,259"/>
<rect class="dg-node " x="20" y="260" width="360" height="56" rx="10"/>
<text class="dg-t" x="34" y="282">Line 4</text>
<text class="dg-s" x="34" y="301">A call allowed for use U1</text>
<text class="dg-n" x="366" y="282" text-anchor="end" >fingerprint of line 3</text>
<path class="dg-ln" d="M 200 316 L 200 340"/>
<polygon class="dg-ar" points="195,331 205,331 200,339"/>
<rect class="dg-node " x="20" y="340" width="360" height="56" rx="10"/>
<text class="dg-t" x="34" y="362">Line 5</text>
<text class="dg-s" x="34" y="381">Kill switch pulled on U2</text>
<text class="dg-n" x="366" y="362" text-anchor="end" >fingerprint of line 4</text>
<g id="agl-audit-t" opacity="0"><rect x="17" y="177" width="366" height="62" rx="12" fill="none" stroke="var(--d-bad)" stroke-width="3"/>
<text class="dg-bd" x="394" y="212">edited</text><rect x="17" y="257" width="366" height="62" rx="12" fill="none" stroke="var(--d-bad)" stroke-width="2" stroke-dasharray="5 5"/><rect x="17" y="337" width="366" height="62" rx="12" fill="none" stroke="var(--d-bad)" stroke-width="2" stroke-dasharray="5 5"/><text class="dg-bd" x="394" y="292">chain breaks</text><text class="dg-bd" x="394" y="372">from here on</text></g>
<rect class="dg-node dg-okb" x="440" y="20" width="180" height="120" rx="10"/>
<text class="dg-t" x="454" y="42">Anchor</text>
<text class="dg-s" x="454" y="66" text-anchor="start" >A copy of where the</text>
<text class="dg-s" x="454" y="84" text-anchor="start" >log ended, kept</text>
<text class="dg-s" x="454" y="102" text-anchor="start" >somewhere else.</text>
<text class="dg-lbl dg-good" x="454" y="126" text-anchor="start" >Catches cut-off lines.</text>
<rect class="dg-node dg-warnb" x="20" y="430" width="600" height="70" rx="10"/>
<text class="dg-t" x="34" y="452">What a chain cannot see on its own</text>
<text class="dg-s" x="34" y="478" text-anchor="start" >Lines cut off the end still verify. That needs the anchor.</text>
<rect class="dg-node " x="20" y="520" width="600" height="80" rx="10"/>
<text class="dg-t" x="34" y="542">Retention and incidents</text>
<text class="dg-s" x="34" y="568" text-anchor="start" >Logs are kept 180 days, then pruned, and the chain still verifies.</text>
<text class="dg-s" x="34" y="586" text-anchor="start" >An incident timeline and a draft report are built from these lines.</text>
<circle id="agl-audit-p" class="dg-pkt dg-good" r="7" cx="0" cy="0"/>
</svg>
