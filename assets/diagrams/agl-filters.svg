<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agl-filters-t agl-filters-d" width="640" height="560" preserveAspectRatio="xMidYMin meet"><title id="agl-filters-t">Where the filters plug in</title><desc id="agl-filters-d">The guardrail scan is one slot. Filter v1, v2, v3 or an outside tool such as Presidio plugs into it through the same small interface. The same test set is run through each.</desc><style>
.dg{background:var(--d-bg,#ffffff);--d-ink:#0f172a;--d-mut:#52617a;--d-line:#b7c3d4;--d-panel:#f1f5fa;--d-acc:#0a7285;--d-accs:rgba(10,114,133,.12);--d-ok:#0b7a5b;--d-oks:rgba(11,122,91,.12);--d-bad:#c0264a;--d-bads:rgba(192,38,74,.12);--d-warn:#8a5208;--d-warns:rgba(138,82,8,.14);font-family:var(--a-fb,system-ui,-apple-system,"Segoe UI",sans-serif)}
@media (prefers-color-scheme:dark){.dg{background:var(--d-bg,#0b1220);--d-ink:#f1f5f9;--d-mut:#93a1bd;--d-line:#2c3a55;--d-panel:#101a2c;--d-acc:#4de2ff;--d-accs:rgba(77,226,255,.12);--d-ok:#7df2d0;--d-oks:rgba(125,242,208,.12);--d-bad:#ff7a93;--d-bads:rgba(255,122,147,.14);--d-warn:#f7c873;--d-warns:rgba(247,200,115,.14)}}
.dg text{fill:var(--d-ink)}
.dg .dg-t{font-weight:700;font-size:14px}
.dg .dg-s{font-size:12px;fill:var(--d-mut)}
.dg .dg-n{font:600 11px/1 var(--a-fm,ui-monospace,Menlo,monospace);fill:var(--d-mut)}
.dg .dg-h{font-weight:700;font-size:15px}
.dg .dg-node{fill:var(--d-panel);stroke:var(--d-line);stroke-width:1.5}
.dg .dg-acc{stroke:var(--d-acc);fill:var(--d-accs)}
.dg .dg-okb{stroke:var(--d-ok);fill:var(--d-oks)}
.dg .dg-badb{stroke:var(--d-bad);fill:var(--d-bads)}
.dg .dg-warnb{stroke:var(--d-warn);fill:var(--d-warns)}
.dg .dg-ln{stroke:var(--d-line);stroke-width:2;fill:none}
.dg .dg-dash{stroke-dasharray:5 5}
.dg .dg-ar{fill:var(--d-line)}
.dg .dg-lbl{font-size:12px;font-weight:600}
.dg .dg-good{fill:var(--d-ok)}.dg .dg-bd{fill:var(--d-bad)}.dg .dg-wn{fill:var(--d-warn)}
.dg text.dg-good,.dg text.dg-bd,.dg text.dg-wn{font-size:12px;font-weight:700}
.dg text.dg-good{fill:var(--d-ok)}.dg text.dg-bd{fill:var(--d-bad)}.dg text.dg-wn{fill:var(--d-warn)}
.dg .dg-pkt{offset-rotate:0deg;opacity:0}
@media (prefers-reduced-motion:reduce){.dg *{animation:none!important}.dg .dg-pkt{opacity:0}.dg .dg-badge{opacity:1!important}}
@keyframes agl-filters-h0{0%,0%{opacity:0}1%,23%{opacity:1}25%,100%{opacity:0}}
.dg #agl-filters-h0{animation:agl-filters-h0 12s linear infinite}
@keyframes agl-filters-h1{0%,25%{opacity:0}26%,48%{opacity:1}50%,100%{opacity:0}}
.dg #agl-filters-h1{animation:agl-filters-h1 12s linear infinite}
@keyframes agl-filters-h2{0%,50%{opacity:0}51%,73%{opacity:1}75%,100%{opacity:0}}
.dg #agl-filters-h2{animation:agl-filters-h2 12s linear infinite}
@keyframes agl-filters-h3{0%,75%{opacity:0}76%,98%{opacity:1}100%,100%{opacity:0}}
.dg #agl-filters-h3{animation:agl-filters-h3 12s linear infinite}
@keyframes agl-filters-p{0%{offset-distance:0%;opacity:0}3%{offset-distance:0%;opacity:1}96%{offset-distance:100%;opacity:1}99%{offset-distance:100%;opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-filters-p{offset-path:path('M 320 76 L 320 112 L 320 168 L 320 214 L 320 366 L 320 458');animation:agl-filters-p 12s linear infinite}</style>
<rect class="dg-node " x="120" y="20" width="400" height="56" rx="10"/>
<text class="dg-t" x="134" y="42">A prompt or an answer</text>
<text class="dg-s" x="134" y="61">Text with made-up personal data, secrets or a hidden instruction.</text>
<path class="dg-ln" d="M 320 76 L 320 112"/>
<polygon class="dg-ar" points="315,103 325,103 320,111"/>
<rect class="dg-node dg-acc" x="40" y="112" width="560" height="56" rx="10"/>
<text class="dg-t" x="54" y="134">The guardrail scan</text>
<text class="dg-s" x="54" y="153">One slot. It asks a filter: what did you find, and what should be masked?</text>
<g>
<rect class="dg-node " x="20" y="214" width="135" height="96" rx="10"/>
<text class="dg-t" x="34" y="236">v1</text>
<text class="dg-s" x="34" y="258" text-anchor="start" >Plain patterns</text>
<text class="dg-s" x="34" y="276" text-anchor="start" >Regex and checksums</text>
</g>
<path class="dg-ln dg-dash" d="M 87 168 L 87 214"/>
<g>
<rect class="dg-node " x="175" y="214" width="135" height="96" rx="10"/>
<text class="dg-t" x="189" y="236">v2</text>
<text class="dg-s" x="189" y="258" text-anchor="start" >Tidies text first</text>
<text class="dg-s" x="189" y="276" text-anchor="start" >Adds a look-back</text>
</g>
<path class="dg-ln dg-dash" d="M 242 168 L 242 214"/>
<g>
<rect class="dg-node " x="330" y="214" width="135" height="96" rx="10"/>
<text class="dg-t" x="344" y="236">v3</text>
<text class="dg-s" x="344" y="258" text-anchor="start" >Fixes the misses</text>
<text class="dg-s" x="344" y="276" text-anchor="start" >Written after v2</text>
</g>
<path class="dg-ln dg-dash" d="M 397 168 L 397 214"/>
<g>
<rect class="dg-node " x="485" y="214" width="135" height="96" rx="10"/>
<text class="dg-t" x="499" y="236">Outside tool</text>
<text class="dg-s" x="499" y="258" text-anchor="start" >Presidio, through</text>
<text class="dg-s" x="499" y="276" text-anchor="start" >an adapter</text>
</g>
<path class="dg-ln dg-dash" d="M 552 168 L 552 214"/>
<rect id="agl-filters-h0" x="17" y="211" width="141" height="102" rx="12" fill="none" stroke="var(--d-acc)" stroke-width="3" opacity="0"/>
<rect id="agl-filters-h1" x="172" y="211" width="141" height="102" rx="12" fill="none" stroke="var(--d-acc)" stroke-width="3" opacity="0"/>
<rect id="agl-filters-h2" x="327" y="211" width="141" height="102" rx="12" fill="none" stroke="var(--d-acc)" stroke-width="3" opacity="0"/>
<rect id="agl-filters-h3" x="482" y="211" width="141" height="102" rx="12" fill="none" stroke="var(--d-acc)" stroke-width="3" opacity="0"/>
<path class="dg-ln" d="M 320 330 L 320 366"/>
<polygon class="dg-ar" points="315,357 325,357 320,365"/>
<rect class="dg-node " x="40" y="366" width="560" height="56" rx="10"/>
<text class="dg-t" x="54" y="388">The same questions every time</text>
<text class="dg-s" x="54" y="407">53 variants, 200 labelled samples, then held-out items the author had not seen.</text>
<path class="dg-ln" d="M 320 422 L 320 458"/>
<polygon class="dg-ar" points="315,449 325,449 320,457"/>
<rect class="dg-node dg-okb" x="40" y="458" width="560" height="80" rx="10"/>
<text class="dg-t" x="54" y="480">Two numbers per filter</text>
<text class="dg-s" x="60" y="506" text-anchor="start" >How much it catches, and how often it raises a false alarm.</text>
<text class="dg-s" x="60" y="524" text-anchor="start" >v3 is 100% on the set it was fixed on. On items it had not seen it scored like v1.</text>
<circle id="agl-filters-p" class="dg-pkt dg-good" r="7" cx="0" cy="0"/>
</svg>
