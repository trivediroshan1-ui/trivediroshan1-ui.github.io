<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" viewBox="0 0 640 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agl-org-t agl-org-d" width="640" height="620" preserveAspectRatio="xMidYMin meet"><title id="agl-org-t">One set of controls, many business units</title><desc id="agl-org-d">Board and executives set the policy. A central team owns the controls that must be identical: gateway, vault, executor, reconciliation, kill switch and evidence. Each business unit decides its own agents, approvers and lists. Policy flows down and reports flow up.</desc><style>
.dg{background:var(--d-bg,#ffffff);--d-ink:#0f172a;--d-mut:#52617a;--d-line:#b7c3d4;--d-panel:#f1f5fa;--d-acc:#0a7285;--d-accs:rgba(10,114,133,.12);--d-ok:#0b7a5b;--d-oks:rgba(11,122,91,.12);--d-bad:#c0264a;--d-bads:rgba(192,38,74,.12);--d-warn:#8a5208;--d-warns:rgba(138,82,8,.14);font-family:var(--a-fb,system-ui,-apple-system,"Segoe UI",sans-serif)}
@media (prefers-color-scheme:dark){.dg{background:var(--d-bg,#0b1220);--d-ink:#f1f5f9;--d-mut:#93a1bd;--d-line:#2c3a55;--d-panel:#101a2c;--d-acc:#4de2ff;--d-accs:rgba(77,226,255,.12);--d-ok:#7df2d0;--d-oks:rgba(125,242,208,.12);--d-bad:#ff7a93;--d-bads:rgba(255,122,147,.14);--d-warn:#f7c873;--d-warns:rgba(247,200,115,.14)}}
.dg text{fill:var(--d-ink)}
.dg .dg-t{font-weight:700;font-size:14px}
.dg .dg-s{font-size:12px;fill:var(--d-mut)}
.dg .dg-n{font:600 11px/1 var(--a-fm,ui-monospace,Menlo,monospace);fill:var(--d-mut)}
.dg .dg-h{font-weight:700;font-size:15px}
.dg .dg-node{fill:var(--d-panel);stroke:var(--d-line);stroke-width:1.5}
.dg .dg-acc{stroke:var(--d-acc);fill:var(--d-accs)}
.dg .dg-okb{stroke:var(--d-ok);fill:var(--d-oks)}
.dg .dg-badb{stroke:var(--d-bad);fill:var(--d-bads)}
.dg .dg-warnb{stroke:var(--d-warn);fill:var(--d-warns)}
.dg .dg-ln{stroke:var(--d-line);stroke-width:2;fill:none}
.dg .dg-dash{stroke-dasharray:5 5}
.dg .dg-ar{fill:var(--d-line)}
.dg .dg-lbl{font-size:12px;font-weight:600}
.dg .dg-good{fill:var(--d-ok)}.dg .dg-bd{fill:var(--d-bad)}.dg .dg-wn{fill:var(--d-warn)}
.dg text.dg-good,.dg text.dg-bd,.dg text.dg-wn{font-size:12px;font-weight:700}
.dg text.dg-good{fill:var(--d-ok)}.dg text.dg-bd{fill:var(--d-bad)}.dg text.dg-wn{fill:var(--d-warn)}
.dg .dg-pkt{offset-rotate:0deg;opacity:0}
@media (prefers-reduced-motion:reduce){.dg *{animation:none!important}.dg .dg-pkt{opacity:0}.dg .dg-badge{opacity:1!important}}
@keyframes agl-org-a{0%{offset-distance:0%;opacity:0}4%{offset-distance:0%;opacity:1}86%{offset-distance:100%;opacity:1}91%{offset-distance:100%;opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-org-a{offset-path:path('M 602 76 L 602 430');animation:agl-org-a 10s linear infinite}
@keyframes agl-org-b{0%{offset-distance:0%;opacity:0}45%{offset-distance:0%;opacity:0}49%{offset-distance:0%;opacity:1}92%{offset-distance:100%;opacity:1}96%{offset-distance:100%;opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-org-b{offset-path:path('M 586 430 L 586 76');animation:agl-org-b 10s linear infinite}</style>
<rect class="dg-node " x="20" y="20" width="600" height="56" rx="10"/>
<text class="dg-t" x="34" y="42">Board and executives</text>
<text class="dg-s" x="34" y="61">Set the risk appetite and the policy. Name who is accountable.</text>
<rect class="dg-node dg-acc" x="20" y="110" width="600" height="92" rx="10"/>
<text class="dg-t" x="34" y="132">Central controls: the same for everyone</text>
<text class="dg-s" x="34" y="156" text-anchor="start" >Gateway, vault, executor, reconciliation, kill switch, evidence.</text>
<text class="dg-s" x="34" y="176" text-anchor="start" >Owned by the head of IAM and the AI platform owner.</text>
<rect class="dg-node " x="20" y="250" width="186" height="150" rx="10"/>
<text class="dg-t" x="34" y="272">Business unit A</text>
<text class="dg-s" x="34" y="304" text-anchor="start" >Agent sponsors</text>
<text class="dg-s" x="34" y="326" text-anchor="start" >Approvers</text>
<text class="dg-s" x="34" y="348" text-anchor="start" >Its own lists</text>
<text class="dg-s" x="34" y="370" text-anchor="start" >Its own agents</text>
<rect class="dg-node " x="227" y="250" width="186" height="150" rx="10"/>
<text class="dg-t" x="241" y="272">Business unit B</text>
<text class="dg-s" x="241" y="304" text-anchor="start" >Agent sponsors</text>
<text class="dg-s" x="241" y="326" text-anchor="start" >Approvers</text>
<text class="dg-s" x="241" y="348" text-anchor="start" >Its own lists</text>
<text class="dg-s" x="241" y="370" text-anchor="start" >Its own agents</text>
<rect class="dg-node " x="434" y="250" width="186" height="150" rx="10"/>
<text class="dg-t" x="448" y="272">Business unit C</text>
<text class="dg-s" x="448" y="304" text-anchor="start" >Agent sponsors</text>
<text class="dg-s" x="448" y="326" text-anchor="start" >Approvers</text>
<text class="dg-s" x="448" y="348" text-anchor="start" >Its own lists</text>
<text class="dg-s" x="448" y="370" text-anchor="start" >Its own agents</text>
<rect class="dg-node " x="20" y="430" width="600" height="56" rx="10"/>
<text class="dg-t" x="34" y="452">Everyone with an account</text>
<text class="dg-s" x="34" y="471">Employees, contractors, vendors, helpers. Sign the policy, enrol MFA, report oddities.</text>
<rect class="dg-node dg-warnb" x="20" y="516" width="600" height="56" rx="10"/>
<text class="dg-t" x="34" y="538">Security operations and audit</text>
<text class="dg-s" x="34" y="557">Watch across all of it. Reconcile, respond, keep the evidence.</text>
<path class="dg-ln" d="M 188 202 L 188 250"/>
<polygon class="dg-ar" points="183,241 193,241 188,249"/>
