<path class="dg-ln" d="M 395 400 L 395 430"/>
<polygon class="dg-ar" points="390,421 400,421 395,429"/>
<path class="dg-ln" d="M 602 76 L 602 110"/>
<polygon class="dg-ar" points="597,101 607,101 602,109"/>
<path class="dg-ln" d="M 602 400 L 602 430"/>
<polygon class="dg-ar" points="597,421 607,421 602,429"/>
<path class="dg-ln" d="M 602 202 L 602 250"/>
<polygon class="dg-ar" points="597,241 607,241 602,249"/>
<path class="dg-ln" d="M 586 430 L 586 77"/>
<polygon class="dg-ar" points="581,85 591,85 586,77"/>
<text class="dg-s" x="320" y="604" text-anchor="middle" >Green: policy flows down. Amber: reports flow up.</text>
<circle id="agl-org-a" class="dg-pkt dg-good" r="7" cx="0" cy="0"/>
<circle id="agl-org-b" class="dg-pkt dg-wn" r="7" cx="0" cy="0"/>
