<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" viewBox="0 0 640 762" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agl-hr-t agl-hr-d" width="640" height="762" preserveAspectRatio="xMidYMin meet"><title id="agl-hr-t">From HR to the directory</title><desc id="agl-hr-d">Eight steps from an accepted offer to a checked account. A request with no approved hire event is refused at step five.</desc><style>
.dg{background:var(--d-bg,#ffffff);--d-ink:#0f172a;--d-mut:#52617a;--d-line:#b7c3d4;--d-panel:#f1f5fa;--d-acc:#0a7285;--d-accs:rgba(10,114,133,.12);--d-ok:#0b7a5b;--d-oks:rgba(11,122,91,.12);--d-bad:#c0264a;--d-bads:rgba(192,38,74,.12);--d-warn:#8a5208;--d-warns:rgba(138,82,8,.14);font-family:var(--a-fb,system-ui,-apple-system,"Segoe UI",sans-serif)}
@media (prefers-color-scheme:dark){.dg{background:var(--d-bg,#0b1220);--d-ink:#f1f5f9;--d-mut:#93a1bd;--d-line:#2c3a55;--d-panel:#101a2c;--d-acc:#4de2ff;--d-accs:rgba(77,226,255,.12);--d-ok:#7df2d0;--d-oks:rgba(125,242,208,.12);--d-bad:#ff7a93;--d-bads:rgba(255,122,147,.14);--d-warn:#f7c873;--d-warns:rgba(247,200,115,.14)}}
.dg text{fill:var(--d-ink)}
.dg .dg-t{font-weight:700;font-size:14px}
.dg .dg-s{font-size:12px;fill:var(--d-mut)}
.dg .dg-n{font:600 11px/1 var(--a-fm,ui-monospace,Menlo,monospace);fill:var(--d-mut)}
.dg .dg-h{font-weight:700;font-size:15px}
.dg .dg-node{fill:var(--d-panel);stroke:var(--d-line);stroke-width:1.5}
.dg .dg-acc{stroke:var(--d-acc);fill:var(--d-accs)}
.dg .dg-okb{stroke:var(--d-ok);fill:var(--d-oks)}
.dg .dg-badb{stroke:var(--d-bad);fill:var(--d-bads)}
.dg .dg-warnb{stroke:var(--d-warn);fill:var(--d-warns)}
.dg .dg-ln{stroke:var(--d-line);stroke-width:2;fill:none}
.dg .dg-dash{stroke-dasharray:5 5}
.dg .dg-ar{fill:var(--d-line)}
.dg .dg-lbl{font-size:12px;font-weight:600}
.dg .dg-good{fill:var(--d-ok)}.dg .dg-bd{fill:var(--d-bad)}.dg .dg-wn{fill:var(--d-warn)}
.dg text.dg-good,.dg text.dg-bd,.dg text.dg-wn{font-size:12px;font-weight:700}
.dg text.dg-good{fill:var(--d-ok)}.dg text.dg-bd{fill:var(--d-bad)}.dg text.dg-wn{fill:var(--d-warn)}
.dg .dg-pkt{offset-rotate:0deg;opacity:0}
@media (prefers-reduced-motion:reduce){.dg *{animation:none!important}.dg .dg-pkt{opacity:0}.dg .dg-badge{opacity:1!important}}
@keyframes agl-hr-a{0%{offset-distance:0%;opacity:0}4%{offset-distance:0%;opacity:1}76%{offset-distance:100%;opacity:1}90%{offset-distance:100%;opacity:1}94%{offset-distance:100%;opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-hr-a{offset-path:path('M 22 66 L 22 682');animation:agl-hr-a 11s linear infinite}
@keyframes agl-hr-b{0%{offset-distance:0%;opacity:0}4%{offset-distance:0%;opacity:1}46%{offset-distance:57.1%;opacity:1}86%{offset-distance:57.1%;opacity:1}92%{offset-distance:57.1%;opacity:0}100%{offset-distance:0%;opacity:0}}
.dg #agl-hr-b{offset-path:path('M 68 66 L 68 682');animation:agl-hr-b 11s linear infinite}
@keyframes agl-hr-bg{0%,44%{opacity:0}46%,86%{opacity:1}89%,100%{opacity:0}}
.dg #agl-hr-bg{animation:agl-hr-bg 11s linear infinite}</style>
<rect class="dg-node " x="96" y="34" width="524" height="64" rx="10"/>
<text class="dg-n" x="110" y="56">1</text>
<text class="dg-t" x="134" y="56">Offer accepted</text>
<text class="dg-s" x="134" y="75">Talent acquisition HR creates the record. HR is the source of truth.</text>
<path class="dg-ln" d="M 358 98 L 358 122"/>
<polygon class="dg-ar" points="353,113 363,113 358,121"/>
<rect class="dg-node " x="96" y="122" width="524" height="64" rx="10"/>
<text class="dg-n" x="110" y="144">2</text>
<text class="dg-t" x="134" y="144">Checks and paperwork</text>
<text class="dg-s" x="134" y="163">Background check, PAN, Aadhaar, bank details. These stay in HR.</text>
<path class="dg-ln" d="M 358 186 L 358 210"/>
<polygon class="dg-ar" points="353,201 363,201 358,209"/>
<rect class="dg-node dg-acc" x="96" y="210" width="524" height="64" rx="10"/>
<text class="dg-n" x="110" y="232">3</text>
<text class="dg-t" x="134" y="232">Two HR approvals</text>
<text class="dg-s" x="134" y="251">Talent acquisition HR and BU HR, two different people. Creates the hire event.</text>
<path class="dg-ln" d="M 358 274 L 358 298"/>
<polygon class="dg-ar" points="353,289 363,289 358,297"/>
<rect class="dg-node " x="96" y="298" width="524" height="64" rx="10"/>
<text class="dg-n" x="110" y="320">4</text>
<text class="dg-t" x="134" y="320">Only the minimum goes to identity</text>
<text class="dg-s" x="134" y="339">Name, email, team, job code, manager, start date.</text>
<path class="dg-ln" d="M 358 362 L 358 386"/>
<polygon class="dg-ar" points="353,377 363,377 358,385"/>
<rect class="dg-node dg-acc" x="96" y="386" width="524" height="64" rx="10"/>
<text class="dg-n" x="110" y="408">5</text>
<text class="dg-t" x="134" y="408">The agent proposes, the gateway checks</text>
<text class="dg-s" x="134" y="427">No approved hire event, no account. The executor acts.</text>
<path class="dg-ln" d="M 358 450 L 358 474"/>
<polygon class="dg-ar" points="353,465 363,465 358,473"/>
<rect class="dg-node " x="96" y="474" width="524" height="64" rx="10"/>
<text class="dg-n" x="110" y="496">6</text>
<text class="dg-t" x="134" y="496">Account created, switched off</text>
<text class="dg-s" x="134" y="515">It stays off until the start date. A withdrawn offer never turns it on.</text>
<path class="dg-ln" d="M 358 538 L 358 562"/>
<polygon class="dg-ar" points="353,553 363,553 358,561"/>
<rect class="dg-node " x="96" y="562" width="524" height="64" rx="10"/>
<text class="dg-n" x="110" y="584">7</text>
<text class="dg-t" x="134" y="584">Day one</text>
<text class="dg-s" x="134" y="603">Access for the job code, MFA enrolment, signed policy, then single sign-on.</text>
<path class="dg-ln" d="M 358 626 L 358 650"/>
<polygon class="dg-ar" points="353,641 363,641 358,649"/>
<rect class="dg-node " x="96" y="650" width="524" height="64" rx="10"/>
<text class="dg-n" x="110" y="672">8</text>
<text class="dg-t" x="134" y="672">It keeps being checked</text>
<text class="dg-s" x="134" y="691">Daily: every account traces to an HR record. Vendor accounts expire.</text>
<path class="dg-ln dg-dash" d="M 22 66 L 22 682"/>
<path class="dg-ln dg-dash" d="M 68 66 L 68 682"/>
<text class="dg-lbl dg-good" x="22" y="20" text-anchor="middle" >event</text>
<text class="dg-lbl dg-bd" x="68" y="20" text-anchor="middle" >none</text>
<circle id="agl-hr-a" class="dg-pkt dg-good" r="7" cx="0" cy="0"/>
<circle id="agl-hr-b" class="dg-pkt dg-bd" r="7" cx="0" cy="0"/>
<text id="agl-hr-bg" class="dg-badge dg-bd" x="372" y="466" opacity="0">No approved hire event: refused here</text>
</svg>
