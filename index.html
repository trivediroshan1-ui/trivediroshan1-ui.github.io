      /*
       * MCP Human Approval Gateway homepage launcher
       */

      .mcp-lab-launcher {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 9999;

        display: grid;
        gap: 9px;

        width: min(340px, calc(100vw - 32px));
        padding: 20px 22px;

        color: #f8fafc;
        text-decoration: none;

        background:
          radial-gradient(
            circle at 90% 0%,
            rgba(77, 226, 255, 0.12),
            transparent 42%
          ),
          linear-gradient(
            135deg,
            rgba(8, 20, 35, 0.97),
            rgba(3, 10, 20, 0.98)
          );

        border: 1px solid rgba(77, 226, 255, 0.35);
        border-radius: 18px;

        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.48),
          0 0 35px rgba(77, 226, 255, 0.1);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        overflow: hidden;

        transition:
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .mcp-lab-launcher::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;

        background: linear-gradient(
          180deg,
          #4de2ff,
          #7df2d0,
          #f7c873
        );
      }

      .mcp-lab-launcher::after {
        content: "";
        position: absolute;
        top: -70px;
        right: -70px;

        width: 150px;
        height: 150px;

        background: rgba(77, 226, 255, 0.08);
        border-radius: 50%;
        filter: blur(12px);

        pointer-events: none;
      }

      .mcp-lab-launcher:hover,
      .mcp-lab-launcher:focus-visible {
        transform: translateY(-5px);
        border-color: rgba(77, 226, 255, 0.75);

        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.55),
          0 0 45px rgba(77, 226, 255, 0.18);
      }

      .mcp-lab-launcher:focus-visible {
        outline: 3px solid rgba(77, 226, 255, 0.45);
        outline-offset: 4px;
      }

      .mcp-lab-close {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 26px;
  height: 26px;
  padding: 0;

  color: #9fb0c4;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 50%;

  font-size: 16px;
  line-height: 1;
  cursor: pointer;

  transition:
    color 150ms ease,
    background 150ms ease;
}

.mcp-lab-close:hover,
.mcp-lab-close:focus-visible {
  color: #f8fafc;
  background: rgba(255, 255, 255, 0.14);
  outline: none;
}

.mcp-lab-status {
        position: relative;
        z-index: 1;

        display: flex;
        align-items: center;
        gap: 8px;

        color: #7df2d0;

        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .mcp-lab-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;

        border-radius: 50%;
        background: #7df2d0;

        box-shadow:
          0 0 0 5px rgba(125, 242, 208, 0.1),
          0 0 14px rgba(125, 242, 208, 0.6);

        animation: mcp-lab-pulse 2s ease-in-out infinite;
      }

      .mcp-lab-launcher strong {
        position: relative;
        z-index: 1;

        color: #f8fafc;

        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        font-size: 20px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.025em;
      }

      .mcp-lab-launcher small {
        position: relative;
        z-index: 1;

        color: #9fb0c4;

        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        font-size: 13px;
        font-weight: 500;
        line-height: 1.5;
      }

      .mcp-lab-action {
        position: relative;
        z-index: 1;

        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;

        margin-top: 3px;
        padding-top: 11px;

        color: #4de2ff;
        border-top: 1px solid rgba(148, 163, 184, 0.15);

        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
      }

      .mcp-lab-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        width: 28px;
        height: 28px;

        color: #03111d;
        background: #4de2ff;
        border-radius: 50%;

        transition: transform 180ms ease;
      }

      .mcp-lab-launcher:hover .mcp-lab-arrow {
        transform: translateX(3px);
      }

      @keyframes mcp-lab-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.55;
          transform: scale(0.82);
        }
      }

      @media (max-width: 640px) {
        .mcp-lab-launcher {
          right: 16px;
          bottom: 16px;

          width: calc(100vw - 32px);
          padding: 17px 19px;
          border-radius: 16px;
        }

        .mcp-lab-launcher strong {
          font-size: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mcp-lab-launcher,
        .mcp-lab-dot,
        .mcp-lab-arrow {
          animation: none;
          transition: none;
        }
      }

<div class="nhi-announce" id="nhi-announce">
<a href="/case-studies/non-human-identity-at-scale/">New case study: Non-Human Identity at Scale — machines outnumber people 50 to 1. See the risk model →</a>
<button type="button" class="nhi-announce-close" aria-label="Dismiss this announcement">&#215;</button>
</div>

<script>
(function () {
var KEY = "nhi-announce-dismissed";
var el = document.getElementById("nhi-announce");
if (!el) return;
if (localStorage.getItem(KEY) === "1") {
el.style.display = "none";
return;
}
var closeBtn = el.querySelector(".nhi-announce-close");
if (closeBtn) {
closeBtn.addEventListener("click", function (e) {
e.preventDefault();
e.stopPropagation();
el.style.display = "none";
localStorage.setItem(KEY, "1");
});
}
})();
</script>
